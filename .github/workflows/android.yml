name: Build Onyx Android ARM64

on:
  workflow_dispatch:
  push:
    paths:
      - 'onyx.cpp'
      - 'onyx.nnue'
      - 'scripts/build_android_arm64.sh'
      - '.github/workflows/build-android-arm64.yml'

permissions:
  contents: read

jobs:
  build-android-arm64:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Android NDK r27c
        shell: bash
        run: |
          set -euo pipefail
          NDK_ARCHIVE="$RUNNER_TEMP/android-ndk-r27c-linux.zip"
          NDK_ROOT="$RUNNER_TEMP/android-ndk-r27c"
          curl --fail --location --retry 3 --retry-delay 2 \
            --connect-timeout 30 \
            'https://dl.google.com/android/repository/android-ndk-r27c-linux.zip' \
            --output "$NDK_ARCHIVE"
          unzip -q "$NDK_ARCHIVE" -d "$RUNNER_TEMP"
          test -x "$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++"
          echo "ANDROID_NDK_HOME=$NDK_ROOT" >> "$GITHUB_ENV"

      - name: Build and verify ARM64 NEON + SDOT
        run: bash scripts/build_android_arm64.sh

      - name: Upload engine-only artifact
        uses: actions/upload-artifact@v4
        with:
          name: Onyx-Android-ARM64
          path: dist/onyx-android-arm64
          if-no-files-found: error
          retention-days: 30
